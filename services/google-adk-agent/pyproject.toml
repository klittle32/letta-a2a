[project]
name = "letta-a2a-google-adk-agent"
version = "0.1.0"
description = "Minimal Google ADK A2A agent for the Hermes interoperability example"
requires-python = ">=3.13,<3.15"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "google-adk[a2a]==2.8.0",
  "litellm==1.97.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
