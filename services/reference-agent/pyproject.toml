[project]
name = "letta-a2a-reference-agent"
version = "0.1.0"
description = "Deterministic non-Letta A2A interoperability fixture"
requires-python = ">=3.13"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:label\\(\\) is deprecated.*:DeprecationWarning:a2a\\.utils\\.proto_utils",
]
