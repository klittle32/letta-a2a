# yaml-language-server: $schema=https://agentgateway.dev/schema/config

config:
  logging:
    format: json

gateways:
  a2a:
    port: 4000
    jwtAuth:
      mode: strict
      preserveToken: false
      issuer: "$OAUTH_ISSUER"
      audiences: [letta-a2a-gateway]
      jwks:
        url: http://auth-server:9000/jwks
      jwtValidationOptions:
        requiredClaims: [exp, nbf, sub]
    authorization:
      rules:
        - require: 'jwt.scope.split(" ").exists(grant, grant == "a2a.invoke")'
  ui:
    port: 4090

routes:
  - name: agent-a
    gateways: [a2a]
    matches:
      - path:
          pathPrefix: /a2a/agent-a
    policies:
      a2a: {}
      urlRewrite:
        path:
          prefix: /agents/agent-a
    backends:
      - host: bridge:8080

  - name: agent-b
    gateways: [a2a]
    matches:
      - path:
          pathPrefix: /a2a/agent-b
    policies:
      a2a: {}
      urlRewrite:
        path:
          prefix: /agents/agent-b
    backends:
      - host: bridge:8080

  - name: reference-agent
    gateways: [a2a]
    matches:
      - path:
          pathPrefix: /a2a/reference-agent
    policies:
      a2a: {}
      urlRewrite:
        path:
          prefix: /
    backends:
      - host: reference-agent:8090

ui:
  gateways: [ui]
