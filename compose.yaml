name: letta-a2a-lab

x-letta-runtime: &letta-runtime
  image: ghcr.io/letta-ai/letta-code:0.30.25
  restart: unless-stopped
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -eu
      mkdir -p /run/letta /workspace
      umask 077
      printf '%s\n' "$${LETTA_APP_SERVER_TOKEN}" > /run/letta/app-server-token
      exec letta server \
        --backend local \
        --listen ws://0.0.0.0:4500 \
        --ws-auth capability-token \
        --ws-token-file /run/letta/app-server-token
  environment: &letta-environment
    OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    LETTA_APP_SERVER_TOKEN: ${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}
  networks: [a2a-lab]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:4500/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  auth-server:
    build:
      context: ./services/reference-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "reference_agent.auth_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
      ]
    environment:
      OAUTH_ISSUER: http://127.0.0.1:${OAUTH_PORT:-9001}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-operator-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-operator-client-secret}
      OAUTH_BRIDGE_CLIENT_ID: ${OAUTH_BRIDGE_CLIENT_ID:-bridge-client}
      OAUTH_BRIDGE_CLIENT_SECRET: ${OAUTH_BRIDGE_CLIENT_SECRET:-bridge-client-secret}
      OAUTH_REFERENCE_CLIENT_ID: ${OAUTH_REFERENCE_CLIENT_ID:-reference-agent-client}
      OAUTH_REFERENCE_CLIENT_SECRET: ${OAUTH_REFERENCE_CLIENT_SECRET:-reference-agent-client-secret}
      OAUTH_OBSERVER_CLIENT_ID: ${OAUTH_OBSERVER_CLIENT_ID:-observer-client}
      OAUTH_OBSERVER_CLIENT_SECRET: ${OAUTH_OBSERVER_CLIENT_SECRET:-observer-client-secret}
      OAUTH_DENIED_CLIENT_ID: ${OAUTH_DENIED_CLIENT_ID:-denied-invoker-client}
      OAUTH_DENIED_CLIENT_SECRET: ${OAUTH_DENIED_CLIENT_SECRET:-denied-invoker-client-secret}
      OAUTH_HERMES_CLIENT_ID: ${OAUTH_HERMES_CLIENT_ID:-hermes-client}
      OAUTH_HERMES_CLIENT_SECRET: ${HERMES_OAUTH_CLIENT_SECRET:-}
      OAUTH_HERMES_TOKEN_TTL_SECONDS: ${OAUTH_HERMES_TOKEN_TTL_SECONDS:-900}
      OAUTH_STALE_CLIENT_SECRET: ${OAUTH_STALE_CLIENT_SECRET:-}
      OAUTH_AUDIENCE: letta-a2a-gateway
      OAUTH_TOKEN_TTL_SECONDS: ${OAUTH_TOKEN_TTL_SECONDS:-60}
    networks: [a2a-lab, a2a-clients]
    ports:
      - "127.0.0.1:${OAUTH_PORT:-9001}:9000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  agent-a:
    <<: *letta-runtime
    hostname: agent-a
    volumes:
      - agent-a-state:/root/.letta
      - agent-a-workspace:/workspace

  agent-b:
    <<: *letta-runtime
    hostname: agent-b
    volumes:
      - agent-b-state:/root/.letta
      - agent-b-workspace:/workspace

  bridge:
    build:
      context: .
      dockerfile: services/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      BRIDGE_PUBLIC_BASE_URL: http://bridge:8080
      CONTEXT_STORE_PATH: /data/contexts.json
      TURN_TIMEOUT_MS: ${TURN_TIMEOUT_MS:-120000}
      MAX_A2A_HOPS: ${MAX_A2A_HOPS:-1}
      LETTA_TEST_MODEL: ${LETTA_TEST_MODEL:-openai/gpt-4.1-nano}
      A2A_GATEWAY_URLS: '{"agent-a":"http://agentgateway:4000","agent-b":"http://agentgateway:4000","reference-agent":"http://agentgateway:4000"}'
      OAUTH_TOKEN_URL: http://auth-server:9000/token
      OAUTH_PUBLIC_BASE_URL: http://127.0.0.1:${OAUTH_PORT:-9001}
      OAUTH_CLIENT_ID: ${OAUTH_BRIDGE_CLIENT_ID:-bridge-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_BRIDGE_CLIENT_SECRET:-bridge-client-secret}
      OAUTH_SCOPE: a2a.discover a2a.invoke
      PUSH_CALLBACK_URL: http://webhook-receiver:8100/callbacks/a2a
      PUSH_CALLBACK_TOKEN: ${PUSH_CALLBACK_TOKEN:-a2a-lab-callback-secret}
      AGENT_DEFINITIONS: >-
        [{"key":"agent-a","displayName":"Agent A","appServerUrl":"ws://agent-a:4500","appServerToken":"${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}"},{"key":"agent-b","displayName":"Agent B","appServerUrl":"ws://agent-b:4500","appServerToken":"${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}"}]
    volumes:
      - bridge-state:/data
    networks: [a2a-lab]
    depends_on:
      auth-server:
        condition: service_healthy
      agent-a:
        condition: service_healthy
      agent-b:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  reference-agent:
    build:
      context: ./services/reference-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: http://reference-agent:8090
      A2A_LETTA_URL: http://agentgateway:4000/a2a/agent-a
      OAUTH_TOKEN_URL: http://auth-server:9000/token
      OAUTH_PUBLIC_BASE_URL: http://127.0.0.1:${OAUTH_PORT:-9001}
      OAUTH_CLIENT_ID: ${OAUTH_REFERENCE_CLIENT_ID:-reference-agent-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_REFERENCE_CLIENT_SECRET:-reference-agent-client-secret}
      OAUTH_SCOPE: a2a.discover a2a.invoke
      PUSH_CALLBACK_URL: http://webhook-receiver:8100/callbacks/a2a
      PUSH_CALLBACK_TOKEN: ${PUSH_CALLBACK_TOKEN:-a2a-lab-callback-secret}
    networks: [a2a-lab]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      auth-server:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy

  google-adk-agent:
    profiles: [example-12, example-12-live]
    build:
      context: ./services/google-adk-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: http://google-adk-agent:8000
      OAUTH_PUBLIC_BASE_URL: http://127.0.0.1:${OAUTH_PORT:-9001}
      ADK_MODEL_MODE: ${ADK_MODEL_MODE:-live}
      ADK_MODEL: ${ADK_MODEL:-openai/gpt-4.1-nano}
      OPENAI_API_KEY_FILE: /run/secrets/openai-api-key
    volumes:
      - ${OPENAI_API_KEY_SECRET_FILE:-./.openai-api-key}:/run/secrets/openai-api-key:ro
    networks: [a2a-lab]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  hermes-tui:
    profiles: [example-12-live]
    image: docker.io/nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    command: ["python3", "/opt/letta-a2a/launch-hermes-tui.py"]
    stdin_open: true
    tty: true
    environment:
      HERMES_MODEL: ${HERMES_MODEL:-gpt-5-mini}
      HERMES_OPENAI_API_KEY_FILE: /run/secrets/openai-api-key
      HERMES_OAUTH_CLIENT_ID: ${OAUTH_HERMES_CLIENT_ID:-hermes-client}
      HERMES_OAUTH_CLIENT_SECRET_FILE: /run/secrets/hermes-oauth-client-secret
      HERMES_OAUTH_TOKEN_URL: http://auth-server:9000/token
      HERMES_A2A_GATEWAY_URL: http://agentgateway:4000/a2a/google-adk
      HERMES_CONFIG_TEMPLATE: /opt/letta-a2a/hermes-config.yaml
      HERMES_CONFIG_PATH: /opt/data/config.yaml
    volumes:
      - hermes-state:/opt/data
      - ./services/hermes/config.yaml:/opt/letta-a2a/hermes-config.yaml:ro
      - ./scripts/launch-hermes-tui.py:/opt/letta-a2a/launch-hermes-tui.py:ro
      - ${OPENAI_API_KEY_SECRET_FILE:-./.openai-api-key}:/run/secrets/openai-api-key:ro
    secrets: [hermes-oauth-client-secret]
    networks: [a2a-clients]
    depends_on:
      auth-server:
        condition: service_healthy
      google-adk-agent:
        condition: service_healthy
      agentgateway:
        condition: service_healthy

  webhook-receiver:
    build:
      context: ./services/reference-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "reference_agent.webhook_receiver:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8100",
      ]
    environment:
      PUSH_CALLBACK_TOKEN: ${PUSH_CALLBACK_TOKEN:-a2a-lab-callback-secret}
      PUSH_OBSERVER_TOKEN: ${PUSH_OBSERVER_TOKEN:-a2a-lab-observer-secret}
    networks: [a2a-lab]
    ports:
      - "127.0.0.1:${PUSH_RECEIVER_PORT:-8100}:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
    restart: unless-stopped
    command: ["-f", "/config.yaml"]
    environment:
      OAUTH_ISSUER: http://127.0.0.1:${OAUTH_PORT:-9001}
    volumes:
      - ./agentgateway/config.yaml:/config.yaml:ro
    networks: [a2a-lab, a2a-clients]
    ports:
      - "127.0.0.1:${A2A_GATEWAY_PORT:-4000}:4000"
      - "127.0.0.1:${A2A_GATEWAY_UI_PORT:-4090}:4090"
    depends_on:
      auth-server:
        condition: service_healthy

networks:
  a2a-lab:
    driver: bridge
  a2a-clients:
    driver: bridge

volumes:
  agent-a-state:
  agent-a-workspace:
  agent-b-state:
  agent-b-workspace:
  bridge-state:
  hermes-state:

secrets:
  hermes-oauth-client-secret:
    environment: HERMES_OAUTH_CLIENT_SECRET
