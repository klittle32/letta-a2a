name: letta-a2a-lab

x-letta-runtime: &letta-runtime
  image: ghcr.io/letta-ai/letta-code:0.30.25
  restart: unless-stopped
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -eu
      mkdir -p /run/letta /workspace
      umask 077
      printf '%s\n' "$${LETTA_APP_SERVER_TOKEN}" > /run/letta/app-server-token
      exec letta server \
        --backend local \
        --listen ws://0.0.0.0:4500 \
        --ws-auth capability-token \
        --ws-token-file /run/letta/app-server-token
  environment: &letta-environment
    OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    LETTA_APP_SERVER_TOKEN: ${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}
  networks: [a2a-lab]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:4500/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  auth-server:
    build:
      context: ./services/reference-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "reference_agent.auth_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
      ]
    environment:
      OAUTH_ISSUER: http://127.0.0.1:${OAUTH_PORT:-9000}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-a2a-lab-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-a2a-lab-client-secret}
      OAUTH_STALE_CLIENT_SECRET: ${OAUTH_STALE_CLIENT_SECRET:-}
      OAUTH_AUDIENCE: letta-a2a-gateway
      OAUTH_ALLOWED_SCOPES: ${OAUTH_ALLOWED_SCOPES:-a2a.invoke}
      OAUTH_TOKEN_TTL_SECONDS: ${OAUTH_TOKEN_TTL_SECONDS:-60}
    networks: [a2a-lab]
    ports:
      - "127.0.0.1:${OAUTH_PORT:-9000}:9000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  agent-a:
    <<: *letta-runtime
    hostname: agent-a
    volumes:
      - agent-a-state:/root/.letta
      - agent-a-workspace:/workspace

  agent-b:
    <<: *letta-runtime
    hostname: agent-b
    volumes:
      - agent-b-state:/root/.letta
      - agent-b-workspace:/workspace

  bridge:
    build:
      context: .
      dockerfile: services/bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      BRIDGE_PUBLIC_BASE_URL: http://bridge:8080
      CONTEXT_STORE_PATH: /data/contexts.json
      TURN_TIMEOUT_MS: ${TURN_TIMEOUT_MS:-120000}
      MAX_A2A_HOPS: ${MAX_A2A_HOPS:-1}
      LETTA_TEST_MODEL: ${LETTA_TEST_MODEL:-openai/gpt-4.1-nano}
      A2A_GATEWAY_URLS: '{"agent-a":"http://agentgateway:4000","agent-b":"http://agentgateway:4000","reference-agent":"http://agentgateway:4000"}'
      OAUTH_TOKEN_URL: http://auth-server:9000/token
      OAUTH_PUBLIC_BASE_URL: http://127.0.0.1:${OAUTH_PORT:-9000}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-a2a-lab-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-a2a-lab-client-secret}
      OAUTH_SCOPE: a2a.invoke
      AGENT_DEFINITIONS: >-
        [{"key":"agent-a","displayName":"Agent A","appServerUrl":"ws://agent-a:4500","appServerToken":"${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}"},{"key":"agent-b","displayName":"Agent B","appServerUrl":"ws://agent-b:4500","appServerToken":"${LETTA_APP_SERVER_TOKEN:-a2a-lab-app-server-token}"}]
    volumes:
      - bridge-state:/data
    networks: [a2a-lab]
    depends_on:
      auth-server:
        condition: service_healthy
      agent-a:
        condition: service_healthy
      agent-b:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  reference-agent:
    build:
      context: ./services/reference-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: http://reference-agent:8090
      A2A_LETTA_URL: http://agentgateway:4000/a2a/agent-a
      OAUTH_TOKEN_URL: http://auth-server:9000/token
      OAUTH_PUBLIC_BASE_URL: http://127.0.0.1:${OAUTH_PORT:-9000}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-a2a-lab-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-a2a-lab-client-secret}
      OAUTH_SCOPE: a2a.invoke
    networks: [a2a-lab]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      auth-server:
        condition: service_healthy

  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
    restart: unless-stopped
    command: ["-f", "/config.yaml"]
    environment:
      OAUTH_ISSUER: http://127.0.0.1:${OAUTH_PORT:-9000}
    volumes:
      - ./agentgateway/config.yaml:/config.yaml:ro
    networks: [a2a-lab]
    ports:
      - "127.0.0.1:${A2A_GATEWAY_PORT:-4000}:4000"
      - "127.0.0.1:${A2A_GATEWAY_UI_PORT:-4090}:4090"
    depends_on:
      auth-server:
        condition: service_healthy

networks:
  a2a-lab:
    driver: bridge

volumes:
  agent-a-state:
  agent-a-workspace:
  agent-b-state:
  agent-b-workspace:
  bridge-state:
